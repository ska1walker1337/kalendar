<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Calendar body -->
  <rect x="100" y="140" width="312" height="280" rx="24" fill="none" stroke="url(#accent)" stroke-width="12"/>
  <!-- Calendar top bar -->
  <rect x="100" y="140" width="312" height="60" rx="24" fill="url(#accent)" opacity="0.3"/>
  <!-- Calendar hooks -->
  <rect x="170" y="110" width="16" height="60" rx="8" fill="url(#accent)"/>
  <rect x="326" y="110" width="16" height="60" rx="8" fill="url(#accent)"/>
  <!-- Grid dots -->
  <circle cx="170" cy="260" r="12" fill="#60a5fa" opacity="0.8"/>
  <circle cx="230" cy="260" r="12" fill="#60a5fa" opacity="0.4"/>
  <circle cx="290" cy="260" r="12" fill="#a78bfa" opacity="0.6"/>
  <circle cx="350" cy="260" r="12" fill="#60a5fa" opacity="0.4"/>
  <circle cx="170" cy="320" r="12" fill="#60a5fa" opacity="0.4"/>
  <circle cx="230" cy="320" r="12" fill="#a78bfa" opacity="0.8"/>
  <circle cx="290" cy="320" r="12" fill="#60a5fa" opacity="0.6"/>
  <circle cx="350" cy="320" r="12" fill="#60a5fa" opacity="0.4"/>
  <circle cx="170" cy="380" r="12" fill="#60a5fa" opacity="0.4"/>
  <circle cx="230" cy="380" r="12" fill="#60a5fa" opacity="0.4"/>
  <circle cx="290" cy="380" r="12" fill="#22c55e" opacity="0.8"/>
  <circle cx="350" cy="380" r="12" fill="#60a5fa" opacity="0.4"/>
  <!-- Checkmark on green dot -->
  <path d="M282 380 L288 386 L298 374" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
